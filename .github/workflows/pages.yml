name: Publicar site

on:
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'assets/**'
      - 'docs/index.html'
      - 'index.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# permissoes minimas para o deploy-pages autenticar via OIDC
permissions:
  contents: read
  pages: write
  id-token: write

# uma publicacao por vez; nao cancela a que esta em andamento
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Gerar as paginas
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v5

      - name: Preparar o Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # regenera a partir do template: o index.html publicado nunca
      # sai de sincronia com tools/page.template.html
      - name: Gerar a pagina de Dualidade
        run: python3 tools/build_page.py

      # duas paginas, dois caminhos:
      #   /         -> wiki de Dualidade (index.html da raiz)
      #   /reflex/  -> teste de reacao (docs/index.html)
      - name: Montar o site
        run: |
          mkdir -p _site/reflex
          cp index.html      _site/index.html
          cp docs/index.html _site/reflex/index.html
          touch _site/.nojekyll

      - name: Conferir o que vai ao ar
        run: find _site -type f | sort

      - name: Enviar o artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
